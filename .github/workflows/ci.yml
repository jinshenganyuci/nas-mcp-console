name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      check_published_compose:
        description: 'Test the published image with the current NAS bind-mount Compose'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -c constraints.txt pytest
      - run: python -m pytest -q
      - run: node --check app/static/admin.js
      - run: docker compose config --quiet
      - run: docker compose -f compose.fnos.yaml config --quiet
      - name: Verify published image with bind-mount Compose
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_published_compose }}
        run: |
          image="$(docker compose -f compose.fnos.yaml config --format json | python -c 'import json, sys; print(json.load(sys.stdin)["services"]["nas-mcp"]["image"])')"
          docker pull "$image"
          sh tests/container-smoke.sh "$image"
